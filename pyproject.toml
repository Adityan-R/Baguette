[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shade"
version = "0.1.0"
description = "Terminal-first AI coding and task agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "keyring>=24.3.0",
    "prompt_toolkit>=3.0.43"
]

[project.scripts]
shade = "shade.main:cli"
